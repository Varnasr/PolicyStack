name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile $(find . -name "*.py" -not -path "./.git/*") || true
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,204,301,302,403,429 --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com" --timeout 30 --max-retries 2 "**/*.md"
          fail: false
